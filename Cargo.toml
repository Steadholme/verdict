[package]
name = "verdict"
version = "0.1.0"
edition = "2021"
description = "Verdict — Zanzibar-style ReBAC/ABAC policy decision point for the HOLDFAST stack (relation tuples + a check API every service can consult)."
license = "MIT OR Apache-2.0"

[lib]
name = "verdict"
path = "src/lib.rs"

[[bin]]
name = "verdict"
path = "src/main.rs"

[dependencies]
# HTTP framework (shared with keystone/inkwell/cellar/sanctum): Form/State/Json extractors,
# typed responses, server-rendered HTML for the admin console.
axum = "0.8"
# Async runtime axum runs on. The Store trait is async: handlers `.await` it directly and
# PgStore drives sqlx natively, so a worker thread is NEVER blocked (no block_in_place, no
# sync-over-async bridge). The audit emitter also `tokio::spawn`s its background worker.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }
# Erase the async Store trait methods so `Arc<dyn Store>` stays object-safe (same seam as the
# rest of the estate; a fresh InMemoryStore drops in for tests).
async-trait = "0.1"
# Deserialize the HTML form bodies + the `/api/*` JSON request/response envelopes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ergonomic error/store enums -> JSON error envelope / branded HTML error page.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Epoch -> UTC components for the tuple "created" timestamps (std only — no extra C deps). Same
# crate the rest of the estate pins.
time = { version = "0.3", default-features = false, features = ["std"] }
# CSPRNG (OsRng) for the double-submit CSRF token. rand 0.8 lineage matches the rest of the
# estate (keystone/cellar/sanctum).
rand = "0.8"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# macros, so the build needs NO database. rustls TLS (ring) — no openssl. The same standard SQL
# later runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end tests (no port bind).
tower = { version = "0.5", features = ["util"] }
